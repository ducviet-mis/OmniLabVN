<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLab - Workspace Đọc PDF & Ghi Chú Thông Minh</title>
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400..700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN HEADER -->
    <header class="app-header">
        <div class="brand">
            <i class="fa-solid fa-flask-vial logo-icon"></i>
            <span class="logo-text">OmniLab</span>
        </div>

        <!-- Mode Selector -->
        <div class="mode-switcher">
            <button id="btn-mode-text" class="mode-btn active" title="Chế độ Soạn thảo Văn bản">
                <i class="fa-solid fa-pen-to-square"></i> 📝 Soạn Thảo (Text)
            </button>
            <button id="btn-mode-canvas" class="mode-btn" title="Chế độ Vẽ tay & Kẻ hình">
                <i class="fa-solid fa-paint-brush"></i> 🖊️ Vẽ Tay (Canvas)
            </button>
        </div>

        <!-- File Operations & Tools -->
        <div class="header-actions">
            <label for="pdf-upload" class="action-btn upload-btn" title="Tải file PDF lên">
                <i class="fa-solid fa-file-arrow-up"></i> Mở PDF
            </label>
            <input type="file" id="pdf-upload" accept="application/pdf">

            <button id="btn-toggle-casio" class="action-btn icon-btn" title="Mở Máy tính Casio">
                <i class="fa-solid fa-calculator"></i>
            </button>
            <button id="btn-save" class="action-btn primary-btn" title="Lưu vào LocalStorage">
                <i class="fa-solid fa-floppy-disk"></i> Lưu Bài
            </button>
            <button id="btn-clear-all" class="action-btn danger-btn" title="Xóa dữ liệu trang">
                <i class="fa-solid fa-trash-can"></i> Xóa Tất Cả
            </button>
        </div>
    </header>

    <!-- MAIN SPLIT WORKSPACE -->
    <main class="main-container">
        
        <!-- Left Column: PDF Viewer -->
        <section id="pdf-container" class="split-pane">
            <div class="pdf-toolbar">
                <div class="pdf-controls">
                    <button id="pdf-prev" class="tool-btn" title="Trang trước"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="page-indicator">Trang <span id="pdf-page-num">0</span> / <span id="pdf-page-count">0</span></span>
                    <button id="pdf-next" class="tool-btn" title="Trang sau"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="pdf-zoom-controls">
                    <button id="pdf-zoom-out" class="tool-btn" title="Thu nhỏ"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <span id="pdf-zoom-level">100%</span>
                    <button id="pdf-zoom-in" class="tool-btn" title="Phóng to"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                </div>
            </div>
            <div id="pdf-render-wrapper" class="pdf-viewport">
                <div id="pdf-placeholder" class="placeholder-state">
                    <i class="fa-solid fa-file-pdf placeholder-icon"></i>
                    <p>Chưa có file PDF nào được tải lên.</p>
                    <p class="sub-text">Nhấn "Mở PDF" ở thanh trên để xem tài liệu.</p>
                </div>
                <canvas id="pdf-canvas"></canvas>
            </div>
        </section>

        <!-- Resizer Divider -->
        <div id="resizer" class="resizer-bar" title="Kéo rê để thay đổi kích thước 2 cột"></div>

        <!-- Right Column: Note & Canvas Workspace -->
        <section id="workspace" class="split-pane">
            
            <!-- Dynamic Toolbars Slot -->
            <div class="workspace-toolbars">
                <!-- Rich Text Editor Toolbar -->
                <div id="editor-toolbar" class="toolbar-panel active">
                    <select id="font-family" class="tool-select" title="Phông chữ">
                        <option value="Inter" selected>Inter (Hiện đại)</option>
                        <option value="Roboto">Roboto (Tiêu chuẩn)</option>
                        <option value="Times New Roman">Times New Roman (Cổ điển)</option>
                        <option value="Arial">Arial (Không chân)</option>
                        <option value="Courier Prime">Courier Prime (Máy đánh chữ)</option>
                        <option value="Playfair Display">Playfair Display (Sang trọng)</option>
                        <option value="Dancing Script">Dancing Script (Viết tay)</option>
                    </select>

                    <select id="font-size" class="tool-select" title="Cỡ chữ">
                        <option value="12px">12px</option>
                        <option value="14px">14px</option>
                        <option value="16px" selected>16px</option>
                        <option value="18px">18px</option>
                        <option value="24px">24px</option>
                        <option value="32px">32px</option>
                    </select>

                    <div class="tool-group">
                        <button class="tool-btn" id="btn-bold" title="In đậm (Ctrl+B)"><i class="fa-solid fa-bold"></i></button>
                        <button class="tool-btn" id="btn-italic" title="In nghiêng (Ctrl+I)"><i class="fa-solid fa-italic"></i></button>
                        <button class="tool-btn" id="btn-underline" title="Gạch chân (Ctrl+U)"><i class="fa-solid fa-underline"></i></button>
                        <button class="tool-btn" id="btn-strikethrough" title="Gạch ngang"><i class="fa-solid fa-strikethrough"></i></button>
                    </div>

                    <div class="tool-group">
                        <button class="tool-btn" id="btn-align-left" title="Căn trái"><i class="fa-solid fa-align-left"></i></button>
                        <button class="tool-btn" id="btn-align-center" title="Căn giữa"><i class="fa-solid fa-align-center"></i></button>
                        <button class="tool-btn" id="btn-align-right" title="Căn phải"><i class="fa-solid fa-align-right"></i></button>
                        <button class="tool-btn" id="btn-align-justify" title="Căn đều 2 bên"><i class="fa-solid fa-align-justify"></i></button>
                    </div>

                    <div class="tool-group">
                        <label class="color-picker-wrapper" title="Màu chữ">
                            <i class="fa-solid fa-font"></i>
                            <input type="color" id="text-color" value="#0f172a">
                        </label>
                        <label class="color-picker-wrapper" title="Màu highlight nền chữ">
                            <i class="fa-solid fa-highlighter"></i>
                            <input type="color" id="text-bg-color" value="#fef08a">
                        </label>
                    </div>

                    <div class="tool-group">
                        <button class="tool-btn" id="btn-bullet-list" title="Danh sách dấu chấm"><i class="fa-solid fa-list-ul"></i></button>
                        <button class="tool-btn" id="btn-number-list" title="Danh sách số"><i class="fa-solid fa-list-ol"></i></button>
                    </div>

                    <div class="tool-group">
                        <select id="line-height" class="tool-select" title="Giãn dòng">
                            <option value="1.2">Dòng 1.2</option>
                            <option value="1.5" selected>Dòng 1.5</option>
                            <option value="2.0">Dòng 2.0</option>
                        </select>
                    </div>
                </div>

                <!-- Canvas Drawing Toolbar -->
                <div id="canvas-toolbar" class="toolbar-panel">
                    <div class="tool-group">
                        <button class="tool-btn active" id="tool-pen" title="Bút vẽ"><i class="fa-solid fa-pen"></i></button>
                        <button class="tool-btn" id="tool-highlighter" title="Bút dạ quang (Highlight)"><i class="fa-solid fa-marker"></i></button>
                        <button class="tool-btn" id="tool-eraser" title="Cục tẩy"><i class="fa-solid fa-eraser"></i></button>
                    </div>

                    <div class="tool-group">
                        <button class="tool-btn" id="tool-line" title="Đường thẳng"><i class="fa-solid fa-slash"></i></button>
                        <button class="tool-btn" id="tool-rect" title="Hình chữ nhật"><i class="fa-regular fa-square"></i></button>
                        <button class="tool-btn" id="tool-circle" title="Hình tròn"><i class="fa-regular fa-circle"></i></button>
                        <button class="tool-btn" id="tool-oxy" title="Hệ trục tọa độ Oxy"><i class="fa-solid fa-chart-line"></i></button>
                    </div>

                    <div class="tool-group">
                        <label class="color-picker-wrapper" title="Màu nét vẽ">
                            <i class="fa-solid fa-palette"></i>
                            <input type="color" id="canvas-color" value="#0284c7">
                        </label>
                        <select id="canvas-line-width" class="tool-select" title="Độ dày nét">
                            <option value="2">Mỏng (2px)</option>
                            <option value="4" selected>Vừa (4px)</option>
                            <option value="8">Dày (8px)</option>
                            <option value="16">Rất dày (16px)</option>
                        </select>
                    </div>

                    <div class="tool-group">
                        <button class="tool-btn danger" id="btn-clear-canvas" title="Xóa toàn bộ hình vẽ"><i class="fa-solid fa-broom"></i> Clear Canvas</button>
                    </div>
                </div>
            </div>

            <!-- Double Layer Canvas & Text Workspace -->
            <div id="workspace-viewport" class="workspace-viewport">
                <!-- Layer 1: Rich Text Content Editable -->
                <div id="text-editor" contenteditable="true" spellcheck="false" placeholder="Nhập nội dung ghi chép tại đây..."></div>
                
                <!-- Layer 2: HTML5 Canvas Overlay -->
                <canvas id="note-canvas"></canvas>
            </div>
        </section>
    </main>

    <!-- FLOATING CASIO CALCULATOR MODAL -->
    <div id="casio-modal" class="casio-modal hidden">
        <div id="casio-header" class="casio-header">
            <span class="casio-title"><i class="fa-solid fa-calculator"></i> Casio FX-570 Mini</span>
            <button id="btn-close-casio" class="casio-close-btn">&times;</button>
        </div>
        <div class="casio-body">
            <input type="text" id="casio-display" readonly value="0">
            <div class="casio-keypad">
                <button class="casio-btn function" data-action="clear">AC</button>
                <button class="casio-btn function" data-action="delete">DEL</button>
                <button class="casio-btn function" data-value="(">(</button>
                <button class="casio-btn function" data-value=")">)</button>

                <button class="casio-btn function" data-action="sqrt">√</button>
                <button class="casio-btn function" data-action="pow">x²</button>
                <button class="casio-btn function" data-value="%">%</button>
                <button class="casio-btn operator" data-value="/">÷</button>

                <button class="casio-btn" data-value="7">7</button>
                <button class="casio-btn" data-value="8">8</button>
                <button class="casio-btn" data-value="9">9</button>
                <button class="casio-btn operator" data-value="*">×</button>

                <button class="casio-btn" data-value="4">4</button>
                <button class="casio-btn" data-value="5">5</button>
                <button class="casio-btn" data-value="6">6</button>
                <button class="casio-btn operator" data-value="-">-</button>

                <button class="casio-btn" data-value="1">1</button>
                <button class="casio-btn" data-value="2">2</button>
                <button class="casio-btn" data-value="3">3</button>
                <button class="casio-btn operator" data-value="+">+</button>

                <button class="casio-btn" data-value="0">0</button>
                <button class="casio-btn" data-value=".">.</button>
                <button class="casio-btn action-copy" id="btn-copy-casio" title="Copy kết quả chèn vào văn bản"><i class="fa-regular fa-copy"></i> Copy</button>
                <button class="casio-btn equals" data-action="equals">=</button>
            </div>
        </div>
    </div>

    <!-- Application Script Files -->
    <script src="editor.js"></script>
    <script src="canvas.js"></script>
    <script src="app.js"></script>
</body>
</html>
