<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>OmniLab — Trang chủ</title>
    <meta name="description" content="OmniLab: nơi lưu trữ và tổ chức các ghi chú khoa học của bạn theo thư mục.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="home.css">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
</head>
<body>

    <!-- HEADER -->
    <header class="home-header">
        <a href="home.html" class="brand">
            <span class="logo-mark"><i class="fa-solid fa-flask-vial"></i></span>
            <div class="brand-text">
                <span class="logo-text">OmniLab</span>
                <span class="logo-tagline">Không gian học tập khoa học</span>
            </div>
        </a>

        <div class="header-user hidden" id="header-user">
            <span class="user-chip">
                <span class="user-avatar" id="user-avatar">?</span>
                <span class="user-name" id="user-name-label">—</span>
            </span>
            <button id="btn-logout" class="ghost-btn" title="Đăng xuất">
                <i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span>
            </button>
        </div>
    </header>

    <!-- AUTH VIEW -->
    <main id="auth-view" class="auth-view">
        <div class="auth-card">
            <div class="auth-card-head">
                <span class="auth-badge"><i class="fa-solid fa-flask-vial"></i></span>
                <h1>OmniLab</h1>
                <p>Không gian ghi chép &amp; nghiên cứu khoa học của bạn</p>
            </div>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">Đăng nhập</button>
                <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">Đăng ký</button>
                <span class="auth-tab-thumb" aria-hidden="true"></span>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="auth-form active" novalidate>
                <label class="field">
                    <span class="field-label">Tên tài khoản</span>
                    <span class="field-input">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="login-username" autocomplete="username" placeholder="Nhập tên tài khoản" required>
                    </span>
                </label>

                <label class="field">
                    <span class="field-label">Mật khẩu</span>
                    <span class="field-input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="field-eye" data-toggle-for="login-password" title="Hiện/ẩn mật khẩu"><i class="fa-solid fa-eye"></i></button>
                    </span>
                </label>

                <p class="form-error" id="login-error"></p>

                <button type="submit" class="primary-btn full">
                    <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" class="auth-form" novalidate>
                <label class="field">
                    <span class="field-label">Tên tài khoản</span>
                    <span class="field-input">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-username" autocomplete="username" placeholder="VD: ducviet" required>
                    </span>
                </label>

                <label class="field">
                    <span class="field-label">Mật khẩu</span>
                    <span class="field-input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" required>
                        <button type="button" class="field-eye" data-toggle-for="reg-password" title="Hiện/ẩn mật khẩu"><i class="fa-solid fa-eye"></i></button>
                    </span>
                </label>

                <label class="field">
                    <span class="field-label">Xác nhận mật khẩu</span>
                    <span class="field-input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
                        <button type="button" class="field-eye" data-toggle-for="reg-confirm" title="Hiện/ẩn mật khẩu"><i class="fa-solid fa-eye"></i></button>
                    </span>
                </label>

                <p class="form-error" id="register-error"></p>

                <button type="submit" class="primary-btn full">
                    <i class="fa-solid fa-user-plus"></i> Tạo tài khoản
                </button>
            </form>
        </div>
    </main>

    <!-- DASHBOARD VIEW -->
    <main id="dashboard-view" class="dashboard-view hidden">
        <div class="dashboard-inner">

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-icon accent"><i class="fa-solid fa-folder-open"></i></span>
                    <div>
                        <span class="stat-value" id="stat-folders">0</span>
                        <span class="stat-label">Thư mục</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon green"><i class="fa-solid fa-file-lines"></i></span>
                    <div>
                        <span class="stat-value" id="stat-files">0</span>
                        <span class="stat-label">Ghi chú đã lưu</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon amber"><i class="fa-solid fa-clock-rotate-left"></i></span>
                    <div>
                        <span class="stat-value" id="stat-recent">—</span>
                        <span class="stat-label">Cập nhật gần nhất</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon muted"><i class="fa-solid fa-database"></i></span>
                    <div>
                        <span class="stat-value" id="stat-storage">0 KB</span>
                        <span class="stat-label">Dung lượng</span>
                    </div>
                </div>
            </div>

            <div class="dashboard-toolbar">
                <nav class="breadcrumb" id="breadcrumb" aria-label="Đường dẫn thư mục">
                    <button type="button" class="crumb" data-crumb="root"><i class="fa-solid fa-house"></i> Trang chủ</button>
                </nav>

                <div class="toolbar-actions">
                    <span class="field-input search-input">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Tìm thư mục hoặc ghi chú…">
                    </span>
                    <button type="button" id="btn-new-folder" class="ghost-btn">
                        <i class="fa-solid fa-folder-plus"></i><span>Thư mục mới</span>
                    </button>
                    <button type="button" id="btn-new-note" class="primary-btn">
                        <i class="fa-solid fa-plus"></i><span>Ghi chú mới</span>
                    </button>
                </div>
            </div>

            <!-- Folder grid -->
            <section id="folder-grid" class="card-grid"></section>

            <!-- File grid -->
            <section id="file-grid" class="card-grid hidden"></section>

            <div id="empty-state" class="empty-state hidden">
                <i class="fa-solid fa-inbox"></i>
                <p>Chưa có gì ở đây. Hãy tạo thư mục hoặc ghi chú mới để bắt đầu.</p>
            </div>
        </div>
    </main>

    <!-- Dialogs -->
    <div id="prompt-modal" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h3 id="prompt-title"><i class="fa-solid fa-folder-plus"></i> Thư mục mới</h3>
            <div class="dialog-field">
                <input type="text" id="prompt-input" placeholder="Nhập tên…" autocomplete="off" maxlength="60">
            </div>
            <div class="dialog-actions">
                <button class="dialog-btn ghost" id="prompt-cancel">Hủy</button>
                <button class="dialog-btn primary" id="prompt-ok">Lưu</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h3 id="confirm-title"><i class="fa-solid fa-triangle-exclamation"></i> Xác nhận</h3>
            <p class="dialog-sub" id="confirm-message"></p>
            <div class="dialog-actions">
                <button class="dialog-btn ghost" id="confirm-cancel">Hủy</button>
                <button class="dialog-btn danger" id="confirm-ok">Xóa</button>
            </div>
        </div>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <!-- Nhúng Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="home.js"></script>
</body>
</html>
